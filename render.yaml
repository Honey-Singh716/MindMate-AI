# render.yaml — Render deployment configuration for MindMate AI backend.
# Reference: https://render.com/docs/infrastructure-as-code
#
# Build failure root cause (fixed here):
#   Render sets NODE_ENV=production during build, which makes plain
#   "npm install" skip devDependencies. Vite lives in devDependencies,
#   so the build shell could not find it → "sh: 1: vite: not found".
#   Fix: use "npm ci --include=dev" for the frontend install step so
#   devDependencies (vite, @vitejs/plugin-react) are always installed.

services:
  - type: web
    name: mindmate-ai
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm ci --include=dev --prefix frontend && npm run build --prefix frontend
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: MODELS_CACHE_TTL_MS
        value: "900000"
      - key: EMBEDDING_PROVIDER
        value: local
      - key: EMBEDDING_DIM
        value: "384"
      - key: CORS_ORIGIN
        sync: false
